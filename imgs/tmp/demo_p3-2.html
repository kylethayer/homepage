<html>
<script>
  function toggleImg(){
    const img = document.getElementById("hdr-img")
	img.style.display = img.style.display == "none" ? "" : "none"
  }
</script>
<body>
  <p>Your browser says it can display the following color sets: <span id="display-colors"></span></p>

  <p>If your browser/display says it supports HDR colors (like p3 colors), these color pairs should look different:</p>
  <h3>Test with html background:</h3>
  <table width="50%"><tbody>
    <tr><th></th><th width="50%">sRGB</th><th width="50%">Display P3</th></tr>
    <tr><th>Red</th><td style="background-color: color(srgb 1 0 0);"></td><td style="background-color: color(display-p3 1 0 0);"></td></tr>
    <tr><th>Green</th><td style="background-color: color(srgb 0 1 0);"></td><td style="background-color: color(display-p3 0 1 0)"></td></tr>
    <tr><th>Blue</th><td style="background-color: color(srgb 0 0 1);"></td><td style="background-color: color(display-p3 0 0 1);"></td></tr>
  </tbody></table>
  <h3>Test with svg colors:</h3>
  <table width="150px"><tbody>
    <tr><th>SVG</th><th width="50%">sRGB</th><th width="50%">Display P3</th></tr>
    <tr><th>Red</th>
      <td><svg height="20" width="100"><rect height="20" width="100" fill="color(srgb 1 0 0)"></rect></svg></td>
      <td><svg height="20" width="100"><rect height="20" width="100" fill="color(display-p3 1 0 0)"></rect></svg></td>
    </tr>
    <tr><th>Green</th>
      <td><svg height="20" width="100"><rect height="20" width="100" fill="color(srgb 0 1 0)"></rect></svg></td>
      <td><svg height="20" width="100"><rect height="20" width="100" fill="color(display-p3 0 1 0)"></rect></svg></td>
    </tr>
    <tr><th>Blue</th>
      <td><svg height="20" width="100"><rect height="20" width="100" fill="color(srgb 0 0 1)"></rect></svg></td>
      <td><svg height="20" width="100"><rect height="20" width="100" fill="color(display-p3 0 0 1)"></rect></svg></td>
    </tr>
  </tbody></table>

  <button onclick="toggleImg()">Show/hide hdr img</button><br>
  <img id="hdr-img" src="https://upload.wikimedia.org/wikipedia/commons/thumb/9/90/DCI_P3_RGB_color_cube.png/50px-DCI_P3_RGB_color_cube.png"/>

<script>
  const gamuts = ["sRGB"]

  
  function displaySupportsP3Color() {
    return matchMedia("(color-gamut: p3)").matches;
  }


  function displaySupportsRec2020Color() {
    return matchMedia("(color-gamut: rec2020)").matches;
  }


  if(displaySupportsP3Color()){
    gamuts.push("p3")
  }
  if(displaySupportsRec2020Color()){
    gamuts.push("rec2020")
  }

  document.getElementById("display-colors").innerText = gamuts.join(", ")

  
</script>
</body></html>
